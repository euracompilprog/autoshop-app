<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoShop - Zakaz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Nunito:wght@400;500;600&display=swap');

  :root {
    --red: #e02020;
    --dark: #0d0d0d;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --gold: #f5c518;
    --text: #f0f0f0;
    --muted: #888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a0000 0%, #0d0d0d 60%, #1a1200 100%);
    padding: 16px 20px;
    border-bottom: 2px solid var(--red);
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-icon { font-size: 32px; }
  .header h1 {
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--text);
  }
  .header h1 span { color: var(--red); }
  .cart-btn {
    margin-left: auto;
    background: var(--red);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    position: relative;
  }
  .cart-count {
    background: var(--gold);
    color: #000;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0;
    padding: 14px 20px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 18px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Exo 2', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
  }

  /* PRODUCTS */
  .products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 16px;
  }

  .product-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .product-card:hover {
    border-color: var(--red);
    transform: translateY(-2px);
  }
  .product-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }
  .product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .product-info { padding: 10px; }
  .product-name {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 13px;
    line-height: 1.3;
    margin-bottom: 6px;
    color: var(--text);
  }
  .product-price {
    color: var(--gold);
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 8px;
  }
  .product-price span { font-size: 11px; color: var(--muted); font-weight: 400; }
  .add-btn {
    width: 100%;
    background: var(--red);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 7px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .add-btn:hover { opacity: 0.85; }
  .add-btn.added { background: #1e7e34; }

  /* CART PANEL */
  .cart-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
  }
  .cart-overlay.open { display: block; }
  .cart-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #111;
    border-top: 2px solid var(--red);
    border-radius: 18px 18px 0 0;
    padding: 20px;
    max-height: 75vh;
    overflow-y: auto;
    z-index: 201;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }
  .cart-panel.open { transform: translateY(0); }
  .cart-title {
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 20px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .close-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-item-emoji { font-size: 28px; flex-shrink: 0; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-weight: 600; font-size: 13px; }
  .cart-item-price { color: var(--gold); font-size: 12px; }
  .qty-controls { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    background: var(--border);
    border: none;
    color: white;
    width: 26px; height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-num { font-weight: 700; min-width: 20px; text-align: center; }

  /* PHONE INPUT */
  .phone-section {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .phone-section label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--muted);
  }
  .phone-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 16px;
    font-family: 'Nunito', sans-serif;
    outline: none;
  }
  .phone-input:focus { border-color: var(--red); }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    font-family: 'Exo 2', sans-serif;
    font-size: 18px;
    font-weight: 700;
  }
  .total-price { color: var(--gold); font-size: 22px; }

  .order-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--red), #c00);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    font-size: 17px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s;
  }
  .order-btn:hover { opacity: 0.9; }
  .order-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* SUCCESS */
  .success-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .success-screen.show { display: flex; }
  .success-icon { font-size: 64px; margin-bottom: 16px; }
  .success-screen h2 {
    font-family: 'Exo 2', sans-serif;
    font-size: 24px;
    font-weight: 900;
    color: #1e7e34;
    margin-bottom: 8px;
  }
  .success-screen p { color: var(--muted); }

  .empty-cart {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 14px;
  }

  /* SEARCH */
  .search-wrap {
    padding: 12px 16px 0;
  }
  .search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    outline: none;
  }
  .search-input:focus { border-color: var(--red); }

  .toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e7e34;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 13px;
    z-index: 999;
    transition: transform 0.3s;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🚗</div>
  <div>
    <h1>AUTO<span>SHOP</span></h1>
    <div style="font-size:11px;color:var(--muted);">Avtoshampun & Zapchastlar</div>
  </div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Savat
    <div class="cart-count" id="cartCount">0</div>
  </button>
</div>

<div class="search-wrap">
  <input class="search-input" type="text" placeholder="🔍 Mahsulot qidiring..." oninput="filterProducts(this.value)">
</div>

<div class="tabs" id="tabsContainer"></div>
<div class="products" id="productsGrid"></div>

<!-- Cart Overlay -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-title">
    🛒 Savatcha
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div id="cartItems"></div>
  <div class="phone-section">
    <label>📞 Telefon raqamingiz</label>
    <input class="phone-input" type="tel" id="phoneInput" placeholder="+998 90 123 45 67">
  </div>
  <div class="total-row">
    <span>Jami:</span>
    <span class="total-price" id="totalPrice">0 so'm</span>
  </div>
  <button class="order-btn" id="orderBtn" onclick="placeOrder()">✅ ZAKAZ BERISH</button>
</div>

<div class="toast" id="toast">✓ Savatchaga qo'shildi!</div>

<script>
// ===================== MAHSULOTLAR =====================
const products = [
  // Avtoshampunlar
  { id:1, category:"shampur", name:"Tundra Pro Avtoshampun 1L", price:35000, emoji:"🧴", stock:50 },
  { id:2, category:"shampur", name:"CarWash Ultra Köpük 500ml", price:22000, emoji:"🫧", stock:30 },
  { id:3, category:"shampur", name:"Meguiar's Gold Class 946ml", price:89000, emoji:"✨", stock:15 },
  { id:4, category:"shampur", name:"Turtle Wax Qayta tiklash 750ml", price:55000, emoji:"🐢", stock:25 },
  { id:5, category:"shampur", name:"AutoGlym Shampun 1L", price:67000, emoji:"🚿", stock:20 },
  // Moy & Suyuqliklar
  { id:6, category:"moy", name:"Castrol GTX 5W-30 4L", price:185000, emoji:"🛢️", stock:40 },
  { id:7, category:"moy", name:"Mobil Super 10W-40 4L", price:165000, emoji:"⚙️", stock:35 },
  { id:8, category:"moy", name:"Shell Helix HX7 1L", price:52000, emoji:"🔧", stock:60 },
  { id:9, category:"moy", name:"Antifriz Tosol -40° 1L", price:28000, emoji:"❄️", stock:45 },
  { id:10, category:"moy", name:"Tormoz Suyuqligi DOT4 500ml", price:32000, emoji:"🔴", stock:55 },
  // Filtrlar
  { id:11, category:"filtr", name:"Havo Filtri (universal)", price:45000, emoji:"💨", stock:30 },
  { id:12, category:"filtr", name:"Yog' Filtri Nexia/Damas", price:18000, emoji:"🔩", stock:80 },
  { id:13, category:"filtr", name:"Salon Filtri 87mm", price:25000, emoji:"🌬️", stock:40 },
  { id:14, category:"filtr", name:"Yoqilg'i Filtri 12mm", price:22000, emoji:"⛽", stock:35 },
  // Silindrlar & Qismlar
  { id:15, category:"zapchast", name:"Akkumulyator 60Ah 12V", price:850000, emoji:"🔋", stock:10 },
  { id:16, category:"zapchast", name:"Tormoz Kolodkasi Nexia (to'plam)", price:95000, emoji:"⭕", stock:20 },
  { id:17, category:"zapchast", name:"Shamg'alat Tashqi 17\"", price:320000, emoji:"🛞", stock:8 },
  { id:18, category:"zapchast", name:"Avtomobil Batareyasi 55Ah", price:720000, emoji:"⚡", stock:12 },
  // Aksessuarlar
  { id:19, category:"aksessuar", name:"Avtomobil Hushak 12V", price:65000, emoji:"📣", stock:25 },
  { id:20, category:"aksessuar", name:"USB Zaryadlovchi 2 port", price:38000, emoji:"🔌", stock:50 },
  { id:21, category:"aksessuar", name:"Rubermat To'plami 4 ta", price:120000, emoji:"🟫", stock:30 },
  { id:22, category:"aksessuar", name:"Oyna Tozalagich 500ml", price:18000, emoji:"🪟", stock:45 },
];

const categories = [
  { id:"all", label:"Barchasi" },
  { id:"shampur", label:"🧴 Shampunlar" },
  { id:"moy", label:"🛢️ Moy & Suyuqlik" },
  { id:"filtr", label:"🔩 Filtrlar" },
  { id:"zapchast", label:"⚙️ Zapchastlar" },
  { id:"aksessuar", label:"🎀 Aksessuarlar" },
];

let cart = {};
let activeCategory = "all";
let searchQuery = "";

// ===================== RENDER =====================
function renderTabs() {
  const c = document.getElementById("tabsContainer");
  c.innerHTML = categories.map(cat =>
    `<button class="tab ${cat.id === activeCategory ? 'active' : ''}" 
     onclick="setCategory('${cat.id}')">${cat.label}</button>`
  ).join('');
}

function setCategory(id) {
  activeCategory = id;
  renderTabs();
  renderProducts();
}

function filterProducts(q) {
  searchQuery = q.toLowerCase();
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById("productsGrid");
  const filtered = products.filter(p => {
    const matchCat = activeCategory === "all" || p.category === activeCategory;
    const matchSearch = p.name.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">😕 Mahsulot topilmadi</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const qty = cart[p.id] ? cart[p.id].qty : 0;
    return `
    <div class="product-card">
      <div class="product-img" style="background:#111;display:flex;align-items:center;justify-content:center;font-size:52px;min-height:130px;">
        ${p.emoji}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">${p.price.toLocaleString()} <span>so'm</span></div>
        ${qty > 0 
          ? `<div style="display:flex;align-items:center;gap:6px;">
               <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
               <span class="qty-num" style="color:var(--gold);font-weight:700;">${qty}</span>
               <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
             </div>`
          : `<button class="add-btn" onclick="addToCart(${p.id})">+ Savatchaga</button>`
        }
      </div>
    </div>`;
  }).join('');
}

// ===================== SAVAT =====================
function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  if (cart[id]) cart[id].qty++;
  else cart[id] = { ...p, qty: 1 };
  updateCartCount();
  renderProducts();
  showToast('✓ Savatchaga qo\'shildi!');
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  updateCartCount();
  renderProducts();
  renderCartItems();
}

function updateCartCount() {
  const total = Object.values(cart).reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartCount").textContent = total;
}

function toggleCart() {
  const overlay = document.getElementById("cartOverlay");
  const panel = document.getElementById("cartPanel");
  const isOpen = panel.classList.contains("open");
  overlay.classList.toggle("open", !isOpen);
  panel.classList.toggle("open", !isOpen);
  if (!isOpen) renderCartItems();
}

function renderCartItems() {
  const el = document.getElementById("cartItems");
  const items = Object.values(cart);
  if (items.length === 0) {
    el.innerHTML = `<div class="empty-cart">🛒 Savat bo'sh</div>`;
    document.getElementById("totalPrice").textContent = "0 so'm";
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="cart-item">
      <div class="cart-item-emoji">${item.emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${(item.price * item.qty).toLocaleString()} so'm</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
      </div>
    </div>
  `).join('');

  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById("totalPrice").textContent = total.toLocaleString() + " so'm";
}

// ===================== ZAKAZ =====================
function placeOrder() {
    const phone = document.getElementById("phoneInput").value.trim();
    const items = Object.values(cart);

    if (items.length === 0) {
        alert("! Savat bo'sh! Avval mahsulot qo'shing.");
        return;
    }

    if (!phone || phone.length < 9) {
        alert("! Telefon raqamingizni kiriting!");
        document.getElementById("phoneInput").focus();
        return;
    }

    const total = items.reduce((s, i) => s + i.price * i.qty, 0);

    // Python kodingiz (data['items'], data['total'], data['phone']) kutayotgan format
    const orderData = {
        phone: phone,
        total: total,
        items: items.map(i => ({ name: i.name, qty: i.qty }))
    };

    // Telegram'ga yuborish
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify(orderData));
        window.Telegram.WebApp.close(); // Yuborgandan keyin oynani yopish
    } else {
        console.log("Brauzerda test:", orderData);
        alert("Buyurtma yuborildi (Brauzer testi)");
    }
}

function showSuccess() {
  cart = {};
  updateCartCount();
  document.getElementById("cartPanel").innerHTML = `
    <div class="success-screen show">
      <div class="success-icon">✅</div>
      <h2>Zakaz qabul qilindi!</h2>
      <p style="margin-top:8px;">Operatorimiz tez orada siz bilan bog'lanadi.</p>
      <button onclick="location.reload()" 
        style="margin-top:24px;background:var(--red);color:white;border:none;padding:12px 28px;border-radius:8px;font-family:'Exo 2',sans-serif;font-weight:700;font-size:16px;cursor:pointer;">
        🔄 Yangi Zakaz
      </button>
    </div>`;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// ===================== INIT =====================
renderTabs();
renderProducts();

// Telegram WebApp sozlamalari
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  Telegram.WebApp.onEvent('mainButtonClicked', placeOrder);
}
</script>
</body>
</html>
