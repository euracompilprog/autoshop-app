<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoShop - Zakaz</title>
    <!-- Telegram Scriptini ulash -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Nunito:wght@400;500;600&display=swap');
        :root { --red: #e02020; --dark: #0d0d0d; --card: #1a1a1a; --border: #2a2a2a; --gold: #f5c518; --text: #f0f0f0; --muted: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; padding-bottom: 100px; }
        .header { background: linear-gradient(135deg, #1a0000 0%, #0d0d0d 60%, #1a1200 100%); padding: 16px 20px; border-bottom: 2px solid var(--red); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-family: 'Exo 2', sans-serif; font-weight: 900; font-size: 22px; color: var(--text); }
        .header h1 span { color: var(--red); }
        .cart-btn { margin-left: auto; background: var(--red); border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; position: relative; }
        .cart-count { background: var(--gold); color: #000; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
        .products { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px; }
        .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; padding: 10px; text-align: center; }
        .product-emoji { font-size: 40px; margin-bottom: 10px; }
        .product-name { font-size: 13px; font-weight: 700; margin-bottom: 5px; height: 35px; overflow: hidden; }
        .product-price { color: var(--gold); font-weight: 700; margin-bottom: 10px; }
        .add-btn { width: 100%; background: var(--red); color: white; border: none; border-radius: 7px; padding: 8px; cursor: pointer; font-weight: 700; }
        .cart-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 2px solid var(--red); border-radius: 18px 18px 0 0; padding: 20px; transform: translateY(100%); transition: 0.3s; z-index: 201; }
        .cart-panel.open { transform: translateY(0); }
        .cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; }
        .cart-overlay.open { display: block; }
        .phone-input { width: 100%; background: var(--card); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; margin: 10px 0; outline: none; }
        .order-btn { width: 100%; background: var(--red); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1>AUTO<span>SHOP</span></h1>
    <button class="cart-btn" onclick="toggleCart()">🛒 Savat <div class="cart-count" id="cartCount">0</div></button>
</div>

<div class="products" id="productsGrid"></div>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
    <h3 style="margin-bottom:15px;">🛒 Savatcha</h3>
    <div id="cartItems" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
    <input class="phone-input" type="tel" id="phoneInput" placeholder="Telefon: +998 90 123 45 67">
    <div style="display:flex; justify-content: space-between; margin-bottom: 15px; font-weight: 700;">
        <span>Jami:</span> <span id="totalPrice" style="color:var(--gold);">0 so'm</span>
    </div>
    <button class="order-btn" onclick="placeOrder()">✅ ZAKAZ BERISH</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const products = [
        { id:1, name:"Tundra Pro Shampun", price:35000, emoji:"🧴" },
        { id:2, name:"CarWash Köpük", price:22000, emoji:"🫧" },
        { id:3, name:"Castrol Moy 5W-30", price:185000, emoji:"🛢️" },
        { id:4, name:"Havo Filtri", price:45000, emoji:"💨" }
    ];

    let cart = {};

    function renderProducts() {
        const grid = document.getElementById("productsGrid");
        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="product-emoji">${p.emoji}</div>
                <div class="product-name">${p.name}</div>
                <div class="product-price">${p.price.toLocaleString()} so'm</div>
                <button class="add-btn" onclick="addToCart(${p.id})">Qo'shish</button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const p = products.find(x => x.id === id);
        if (cart[id]) cart[id].qty++;
        else cart[id] = { ...p, qty: 1 };
        updateCart();
    }

    function updateCart() {
        const count = Object.values(cart).reduce((s, i) => s + i.qty, 0);
        document.getElementById("cartCount").textContent = count;
    }

    function toggleCart() {
        document.getElementById("cartPanel").classList.toggle("open");
        document.getElementById("cartOverlay").classList.toggle("open");
        renderCartItems();
    }

    function renderCartItems() {
        const el = document.getElementById("cartItems");
        const items = Object.values(cart);
        if (items.length === 0) { el.innerHTML = "Savat bo'sh"; return; }
        
        el.innerHTML = items.map(i => `
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px;">
                <span>${i.name} (${i.qty}x)</span>
                <span>${(i.price * i.qty).toLocaleString()} so'm</span>
            </div>
        `).join('');
        
        const total = items.reduce((s, i) => s + i.price * i.qty, 0);
        document.getElementById("totalPrice").textContent = total.toLocaleString() + " so'm";
    }

    function placeOrder() {
        const phone = document.getElementById("phoneInput").value;
        const items = Object.values(cart);

        if (items.length === 0 || phone.length < 9) {
            alert("Savat bo'sh yoki telefon xato!");
            return;
        }

        const orderData = {
            phone: phone,
            total: items.reduce((s, i) => s + i.price * i.qty, 0),
            items: items.map(i => ({ name: i.name, qty: i.qty }))
        };

        tg.sendData(JSON.stringify(orderData)); // Botga ma'lumot yuborish
        tg.close(); // Oynani yopish
    }

    renderProducts();
</script>
</body>
</html>
